databases:
  - name: talento-rapido-db
    plan: free
    databaseName: talento_rapido
    user: talento_rapido

services:
  - type: web
    name: talento-rapido-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: TalentoRapido
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://talento-rapido-api.onrender.com
      - key: APP_LOCALE
        value: pt_BR
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: talento-rapido-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talento-rapido-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: talento-rapido-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: talento-rapido-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talento-rapido-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: FILESYSTEM_DISK
        value: local
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: talento-rapido-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://talento-rapido-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
